name: Uptime check

on:
  schedule:
    # Cada 5 minutos (mínimo permitido por GitHub). Puede haber retrasos de
    # 5-30 min en horas de mucha carga en GitHub — no es tiempo real estricto.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}  # permite lanzarlo manualmente desde la pestaña Actions, para probar

permissions:
  contents: write  # necesario para poder guardar state.json de vuelta en el repo

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Revisar los sitios y avisar por WhatsApp si hace falta
        run: python monitor.py
        env:
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}

      - name: Guardar el estado si cambió
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "uptime-bot"
            git config user.email "actions@users.noreply.github.com"
            git add state.json
            git commit -m "Actualiza estado de monitoreo [skip ci]"
            git push
          else
            echo "Sin cambios de estado, no hace falta commitear."
          fi
